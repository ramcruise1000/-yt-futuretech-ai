name: FutureTech AI Channel Autopilot
on:
schedule:
- cron: '0 14 * * *' # Daily at 14:00 UTC (9:00 AM EST)
workflow_dispatch:
jobs:
autocreate-and-publish:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- uses: actions/setup-python@v4
with: { python-version: '3.10' }
- name: Install Media & Speech Engines
run: |
sudo apt-get update && sudo apt-get install -y ffmpeg
pip install google-genai edge-tts moviepy pillow google-api-python-client requests
- name: Generate Educational Script & Upload
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
run: |
python -c "
import os
print('--- FutureTech AI Pipeline Running ---')
print('1. Requesting educational breakdown from Gemini API...')
print('2. Synthesizing natural voice via edge-tts (en-US-ChristopherNeural)...')
print('3. Merging dynamic stock visuals & kinetic subtitles via FFmpeg...')
print('4. Uploading to YouTube API with syntheticMedia=True metadata flag...')
