name: FutureTech AI Channel Autopilot

on:
  schedule:
    # 1. Main Daily Automation Pipeline (Daily at 14:00 UTC)
    - cron: '0 14 * * *'
    # 2. Viral 12-Hour Curator Shorts (Twice Daily at 02:30 & 14:30 UTC)
    - cron: '30 2,14 * * *'
    # 3. Long-Form Widescreen Deep Dives (Twice Daily at 06:00 & 18:00 UTC)
    - cron: '0 6,18 * * *'
    # 4. 12-Hour Animated AI Presenter Show (Every 12 Hours at 00:00 & 12:00 UTC)
    - cron: '0 0,12 * * *'
    # 5. 6-Hour Gaming & Pop-Culture AI Academy (Every 6 Hours at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      pipeline_to_run:
        description: 'Select which pipeline to run manually'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'main-autopilot'
          - '12h-viral-curator'
          - 'longform-ai-curator'
          - '12h-animated-presenter'
          - '6h-gaming-ai-parody'

jobs:
  # JOB 1: Main Daily Automation Pipeline
  run-main-autopilot:
    if: github.event_name == 'schedule' || github.event.inputs.pipeline_to_run == 'all' || github.event.inputs.pipeline_to_run == 'main-autopilot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run Main AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python pipeline.py

  # JOB 2: 12-Hour Viral Shorts Curator
  run-12h-viral-curator:
    if: github.event_name == 'schedule' || github.event.inputs.pipeline_to_run == 'all' || github.event.inputs.pipeline_to_run == '12h-viral-curator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run 12H Viral Curator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python curator_pipeline.py

  # JOB 3: Long-Form 16:9 Widescreen Deep Dives
  run-longform-ai-curator:
    if: github.event_name == 'schedule' || github.event.inputs.pipeline_to_run == 'all' || github.event.inputs.pipeline_to_run == 'longform-ai-curator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run Long-Form 16:9 AI Curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python longform_curator_pipeline.py

  # JOB 4: 12-Hour Animated AI Presenter Virtual Studio
  run-12h-animated-presenter:
    if: github.event_name == 'schedule' || github.event.inputs.pipeline_to_run == 'all' || github.event.inputs.pipeline_to_run == '12h-animated-presenter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run 12-Hour Animated AI Presenter Pipeline
        env:
