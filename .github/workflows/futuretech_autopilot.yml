name: FutureTech AI Channel Autopilot

on:
  schedule:
    # 1. Main Daily Automation Pipeline runs daily at 14:00 UTC (9:00 AM EST)
    - cron: '0 14 * * *'
    # 2. Viral 12-Hour Curator Pipeline runs twice daily at 02:30 UTC & 14:30 UTC
    - cron: '30 2,14 * * *'
    # 3. Independent Long-Form (3-7 min) AI News Curator runs twice daily at 06:00 UTC & 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual execution from GitHub Actions UI

jobs:
  run-main-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run Main AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline.py

  run-12h-viral-curator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run 12H Viral Curator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python curator_pipeline.py

  run-longform-ai-curator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run Long-Form (3-7 min) AI News Curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python longform_curator_pipeline.py
