name: FutureTech AI Channel Autopilot

on:
  schedule:
    - cron: '0 14 * * *'     # 1. Main Daily Automation (14:00 UTC)
    - cron: '30 2,14 * * *'  # 2. Viral 12H Curator Shorts (02:30 & 14:30 UTC)
    - cron: '0 6,18 * * *'   # 3. Long-Form Widescreen Digest (06:00 & 18:00 UTC)
    - cron: '0 0,12 * * *'   # 4. 12-Hour Animated AI Presenter Show (00:00 & 12:00 UTC)
  workflow_dispatch:

jobs:
  # (Previous jobs remain untouched) ...

  run-12h-animated-presenter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run 12-Hour Animated AI Presenter Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python animated_presenter_pipeline.py
