name: FutureTech AI Channel Autopilot

on:
  schedule:
    # Runs automatically every day at 14:00 UTC (9:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from browser

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Media & Speech Engines
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts moviepy==1.0.3 pillow google-api-python-client google-auth-oauthlib google-genai

      - name: Run Full AI Content & Upload Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline.py
