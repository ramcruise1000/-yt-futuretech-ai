name: FutureTech AI Channel Autopilot

on:
  schedule:
    # 1. Main Daily Automation (Daily at 14:00 UTC)
    - cron: '0 14 * * *'
    # 2. Viral 12-Hour Curator Shorts (Twice Daily at 02:30 & 14:30 UTC)
    - cron: '30 2,14 * * *'
    # 3. Long-Form Widescreen Deep Dives (Twice Daily at 06:00 & 18:00 UTC)
    - cron: '0 6,18 * * *'
    # 4. 12-Hour Virtual Studio Presenter (Every 12 Hours at 00:00 & 12:00 UTC)
    - cron: '0 0,12 * * *'
    # 5. NEW: 6-Hour Gaming & Pop-Culture AI Academy (Every 6 Hours at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  # (Previous jobs remain untouched) ...

  run-6h-gaming-ai-parody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade edge-tts gtts
          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python game_parody_presenter_pipeline.py
