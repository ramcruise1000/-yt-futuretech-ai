          pip install requests feedparser moviepy==1.0.3 pillow==9.5.0 numpy google-api-python-client google-auth-oauthlib google-genai groq

      - name: Run 6-Hour Gaming AI Parody Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
