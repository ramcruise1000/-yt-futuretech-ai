          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python animated_presenter_pipeline.py

  # JOB 5: 6-Hour Gaming & Pop-Culture AI Academy Parody
  run-6h-gaming-ai-parody:
    if: github.event_name == 'schedule' || github.event.inputs.pipeline_to_run == 'all' || github.event.inputs.pipeline_to_run == '6h-gaming-ai-parody'
